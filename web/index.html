<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to Hello World</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        outline: none;
        user-select: none;
        resize: none;
      }
      body {
        width: 100dvw;
        height: 100dvh;

        > .base {
          width: 100%;
          height: 100%;

          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 1rem;

          > * {
            width: 75%;

            box-shadow: 3px 3px 15px rgba(33, 33, 33, 0.3);
            border-radius: 0.25rem;
            padding: 0.5rem;
          }

          > header {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;

            > div {
              display: flex;
              flex-direction: column;
              > h5 {
                margin-left: 25px;
              }
            }
            > nav {
              > ul {
                display: flex;
                list-style: none;
                gap: 0.75rem;
              }
            }
          }
          > main {
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="base">
      <header>
        <div>
          <h3>Welcome to</h3>
          <h5>Hello World</h5>
        </div>
        <nav>
          <ul>
            <li>Home</li>
            <li>About</li>
            <li>Terms of Use</li>
            <li>Start</li>
          </ul>
        </nav>
      </header>
      <main>
        <blockquote cite="">This is my chat bot</blockquote>
      </main>
    </div>
  </body>
</html>

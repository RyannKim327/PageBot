<!doctype html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
        border: 0;
        box-sizing: border-box;
        user-select: none;
        outline: none;
      }
      div {
        width: 100dvw;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #131320;
        color: white;

        > .main {
          display: flex;
          flex-direction: column;
          width: 25%;
          height: 60%;
          background-color: rgba(150, 150, 150, 0.2);
          box-sizing: border-box;
          padding: 0.5rem;
          gap: 0.5rem;
          backdrop-filter: blur(40px);
          box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);

          > .field {
            width: 100%;
            height: 1.75rem;
            background-color: white;
            border-radius: 25px;
            border: 1px solid rgba(200, 200, 200, 0.4);

            > input {
              background-color: transparent;
              height: 100%;
              width: 100%;
              padding: 0.25rem;
            }
          }
          .body {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 1rem;
            background-color: transparent;

            > span {
              display: flex;
              justify-content: center;
              align-items: center;
              border-radius: 0.25rem;
              border: 1px solid white;
              aspect-ratio: 1/1;
              box-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
            }
          }
        }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="main">
        <h3>Hindi Calculator</h3>
        <div class="field">
          <input type="text" id="number" />
        </div>
        <div class="body">
          <span>7</span>
          <span>8</span>
          <span>9</span>
          <span>/</span>
          <span>4</span>
          <span>5</span>
          <span>6</span>
          <span>*</span>
          <span>1</span>
          <span>2</span>
          <span>3</span>
          <span>-</span>
          <span>.</span>
          <span>0</span>
          <span>=</span>
          <span>+</span>
        </div>
      </div>
    </div>
  </body>
  <script>
    const spans = document.getElementsByTagName("span");
    let equation = "";
    let current = "";

    function enter_number(text) {
      const operators = "+-*/";

      if (text !== "=") {
        current += text;

        if (operators.includes(text)) {
          equation += current;
          current = "";
        }

        document.getElementById("number").value = current;
      } else {
        equation += current;
        try {
          current = eval(equation) ?? "Error po, pakiulit";
        } catch (e) {
          current = "Error po, pakiulit";
        }
        document.getElementById("number").value = current;
      }
    }

    for (let span of spans) {
      span.onclick = () => {
        enter_number(span.innerText);
      };
    }
  </script>
</html>

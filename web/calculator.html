<!doctype html>
<html>
  <!-- TODO: Your task is to know the flag based on the clues provided. -->
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
        border: 0;
        box-sizing: border-box;
        user-select: none;
        outline: none;
      }
      div {
        width: 100dvw;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #131320;
        color: white;

        > .main {
          display: flex;
          flex-direction: column;
          width: 25%;
          height: 60%;
          background-color: rgba(150, 150, 150, 0.2);
          box-sizing: border-box;
          padding: 0.5rem;
          gap: 0.5rem;
          backdrop-filter: blur(40px);
          box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);

          > .field {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 1.75rem;
            background-color: white;
            border-radius: 25px;
            border: 1px solid rgba(200, 200, 200, 0.4);
            padding: 0 0.5rem;

            > input {
              background-color: transparent;
              height: 100%;
              width: 100%;
              padding: 0.25rem;
            }

            > label {
              color: black;
            }
          }
          .body {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 1rem;
            background-color: transparent;

            > span {
              display: flex;
              justify-content: center;
              align-items: center;
              border-radius: 0.25rem;
              border: 1px solid white;
              aspect-ratio: 1/1;
              box-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
            }
          }
        }
      }
    </style>
  </head>
  <body>
    <div>
      <!-- INFO: The one way to get the flag is to execute it into the input. -->
      <div class="main">
        <h3>Hindi Calculator</h3>
        <h5 id="wordofwisdom">An advance level <label style="color: red">calculator</label> for all</h5>
        <div class="field">
          <input type="text" id="number" />
          <label onclick="backspace()"><= </label>
        </div>
        <div class="body">
          <span>7</span>
          <span>8</span>
          <span>9</span>
          <span>/</span>
          <span>4</span>
          <span>5</span>
          <span>6</span>
          <span>*</span>
          <span>1</span>
          <span>2</span>
          <span>3</span>
          <span>-</span>
          <span>.</span>
          <span>0</span>
          <span>=</span>
          <span>+</span>
        </div>
      </div>
    </div>
  </body>
  <script>
    const spans = document.getElementsByTagName("span");
    let equation = "";
    let current = "";

    async function sha1(input) {
      const encoder = new TextEncoder();
      const data = encoder.encode(input);
      const hashBuffer = await crypto.subtle.digest('SHA-1', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      return hashHex;
    }

    function backspace() {
      try {
        current = current.substring(0, current.length - 1);
        parseInt(current);
      } catch (e) {
        current = "";
      }
      document.getElementById("number").value = current;
    }

    async function enter_number(text) {
      const operators = "+-*/";

      if (text !== "=") {
        current += text;

        if (operators.includes(text)) {
          equation += current;
          current = "";
        }

        document.getElementById("number").value = current;
      } else {
        const data = await sha1(document.getElementById("number").value)
        if(data === "46237b3d702aad617eae653792a6269e836aa44d"){
          fetch("/listermaster", {
            "method": "POST",
            "headers": {
              "Content-Type": "application/json"
            },
            "body": JSON.stringify({
              "key": "value"
            })
          }).then(res => res.json()).then(res => {
            document.getElementById("wordofwisdom").innerHTML = `<marquee>${res.key}</marquee>`
            current = "Error po, pakiulit";
            setTimeout(() => {
              document.getElementById("wordofwisdom").innerHTML = `An advance level <label style="color: red">calculator</label> for all`
            }, 60000)
          })
        }else{
          equation += current;
          try {
            current = eval(equation) ?? "Error po, pakiulit";
          } catch (e) {
            current = "Error po, pakiulit";
          }
        }
        document.getElementById("number").value = current;
      }
    }

    for (let span of spans) {
      span.onclick = () => {
        enter_number(span.innerText);
      };
    }
    
  </script>
</html>
